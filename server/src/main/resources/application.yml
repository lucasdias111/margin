margin:
  version: ${MARGIN_VERSION:dev}
  instance:
    name: ${MARGIN_INSTANCE_NAME:}
    registration-mode: ${MARGIN_REGISTRATION_MODE:INVITE}
  admin:
    email: ${MARGIN_ADMIN_EMAIL:}
    password: ${MARGIN_ADMIN_PASSWORD:}
  turn:
    secret: ${TURN_SECRET:}
    uris: ${TURN_URIS:}
    ttl: 12h
  gifs:
    klipy-api-key: ${KLIPY_API_KEY:}
  meetings:
    guest-token-secret: ${MEETING_GUEST_TOKEN_SECRET}
  app:
    base-url: ${APP_BASE_URL}
  mail:
    from: ${SMTP_FROM:noreply@localhost}
  cors:
    allowed-origins: ${margin.app.base-url},app://

server:
  # Behind the bundled proxy (or your own), take the client address from X-Forwarded-For, but only
  # when the request comes from a trusted proxy: private network ranges by default, plus any
  # addresses matched by TRUSTED_PROXIES (a regular expression). Everyone else can't spoof it.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      trusted-proxies: ${TRUSTED_PROXIES:}

spring:
  application:
    name: margin-server
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 200
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_SIZE:50MB}
  threads:
    virtual:
      enabled: true

  flyway:
    clean-disabled: true

  mail:
    # Mail is optional: with no SMTP_HOST the instance runs without sending any email.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:5184000000}

storage:
  # local keeps files on the server (the uploads volume); s3 uses any S3-compatible store.
  type: ${STORAGE_TYPE:local}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:eu-central}
    bucket-name: ${S3_BUCKET:margin}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    base-url: ${margin.app.base-url}/api/files
    cdn-base-url: ${S3_CDN_BASE_URL:}
    presign-ttl-seconds: 21600
  local:
    upload-dir: ${UPLOAD_DIR:/var/margin/uploads}
    base-url: ${margin.app.base-url}/api/files

sfu:
  url: ${SFU_URL}
  public-url: ${SFU_PUBLIC_URL}
  internal-api-key: ${INTERNAL_API_KEY}
  token-secret: ${SFU_SECRET}
  token-expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: unrestricted
  server:
    port: 9090
push:
  fcm:
    service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
  apns:
    key-file: ${APNS_KEY_FILE:}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    bundle-id: ${APNS_BUNDLE_ID:}
    production: ${APNS_PRODUCTION:false}
