# ── Proxy cache zones ──────────────────────────────────────────────────────
proxy_cache_path /var/cache/nginx/updates levels=1:2 keys_zone=updates_cache:10m max_size=2g inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/files   levels=1:2 keys_zone=files_cache:10m   max_size=15g inactive=2h   use_temp_path=off;

# ── updates.margin.chat — Electron auto-update files ───────────────────────
server {
    listen 80;
    server_name updates.margin.chat;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name updates.margin.chat;

    ssl_certificate     /etc/letsencrypt/live/updates.margin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.margin.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_cache          updates_cache;
    proxy_cache_lock     on;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires;

    # Update manifests — short cache so clients pick up new versions quickly
    location ~* \.(yml|yaml)$ {
        proxy_pass          https://nbg1.your-objectstorage.com/margininstall$request_uri;
        proxy_set_header    Host nbg1.your-objectstorage.com;
        proxy_ssl_server_name on;
        proxy_cache_valid   200 5m;
        add_header          Cache-Control "public, max-age=300";
        add_header          X-Cache-Status $upstream_cache_status;
    }

    # Installer binaries — immutable once published, cache for 1 year
    location ~* \.(zip|dmg|blockmap)$ {
        proxy_pass          https://nbg1.your-objectstorage.com/margininstall$request_uri;
        proxy_set_header    Host nbg1.your-objectstorage.com;
        proxy_ssl_server_name on;
        proxy_cache_valid   200 365d;
        add_header          Cache-Control "public, max-age=31536000, immutable";
        add_header          X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass          https://nbg1.your-objectstorage.com/margininstall$request_uri;
        proxy_set_header    Host nbg1.your-objectstorage.com;
        proxy_ssl_server_name on;
        proxy_cache_valid   200 5m;
    }
}

# ── files.margin.chat — User file storage ──────────────────────────────────
server {
    listen 80;
    server_name files.margin.chat;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.margin.chat;

    ssl_certificate     /etc/letsencrypt/live/files.margin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.margin.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_cache          files_cache;
    proxy_cache_lock     on;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid    200 1h;

    # URL path → S3 key prefix mapping (matches S3StorageService.PATH_TO_PREFIX)
    location /user-profiles/ {
        proxy_pass        https://hel1.your-objectstorage.com/margin/users/;
        proxy_set_header  Host hel1.your-objectstorage.com;
        proxy_ssl_server_name on;
        add_header        Cache-Control "public, max-age=3600";
        add_header        X-Cache-Status $upstream_cache_status;
    }

    location /margin-icons/ {
        proxy_pass        https://hel1.your-objectstorage.com/margin/margins/;
        proxy_set_header  Host hel1.your-objectstorage.com;
        proxy_ssl_server_name on;
        add_header        Cache-Control "public, max-age=3600";
        add_header        X-Cache-Status $upstream_cache_status;
    }

    location /conversation-images/ {
        proxy_pass        https://hel1.your-objectstorage.com/margin/conversations/;
        proxy_set_header  Host hel1.your-objectstorage.com;
        proxy_ssl_server_name on;
        add_header        Cache-Control "public, max-age=3600";
        add_header        X-Cache-Status $upstream_cache_status;
    }

    location /stored-files/ {
        proxy_pass        https://hel1.your-objectstorage.com/margin/stored/;
        proxy_set_header  Host hel1.your-objectstorage.com;
        proxy_ssl_server_name on;
        add_header        Cache-Control "public, max-age=3600";
        add_header        X-Cache-Status $upstream_cache_status;
    }
}
