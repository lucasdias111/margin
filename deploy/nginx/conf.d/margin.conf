# ── Security ──────────────────────────────────────────────────────────────
server_tokens off;

# ── Compression ───────────────────────────────────────────────────────────
gzip on;
gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml font/woff2;
gzip_min_length 1024;
gzip_vary on;

# ── Rate limit zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_status 429;

# ── Redirect www → non-www (HTTP) ─────────────────────────────────────────
server {
    listen 80;
    server_name www.margin.chat;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://margin.chat$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.margin.chat;

    ssl_certificate     /etc/letsencrypt/live/margin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/margin.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://margin.chat$request_uri;
}

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name margin.chat;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name margin.chat;

    client_max_body_size 50M;

    ssl_certificate     /etc/letsencrypt/live/margin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/margin.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Spring Boot REST API ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass         http://margin-server:8080/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Spring Boot auth endpoints (tighter limit) ─────────────────────────
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass         http://margin-server:8080/api/auth/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Spring Boot WebSocket (Netty) ──────────────────────────────────────
    location /ws {
        # JWT is passed as ?token= on the upgrade request — keep it out of access logs.
        access_log off;
        proxy_pass          http://margin-server:8081/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── mediasoup SFU signaling WebSocket ─────────────────────────────────
    location /sfu {
        # Room JWT is passed as ?token= on the upgrade request — keep it out of access logs.
        access_log off;
        proxy_pass          http://margin-sfu:3000/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Spring Actuator (internal health — block from public) ──────────────
    location /actuator {
        deny all;
        return 403;
    }

    # ── Web app ───────────────────────────────────────────────────────────
    location /app/ {
        proxy_pass         http://margin-web:80/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Root opens the web app ─────────────────────────────────────────────
    location = / {
        return 302 /app/;
    }
}
