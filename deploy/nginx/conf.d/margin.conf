# nginx/conf.d/margin.conf

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Spring Boot REST API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://margin-server:8080/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Spring Boot WebSocket (Netty) ──────────────────────────────────────
    location /ws {
        proxy_pass          http://margin-server:8080/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── mediasoup SFU signaling WebSocket ─────────────────────────────────
    location /sfu {
        proxy_pass          http://mediasoup-sfu:3000/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Spring Actuator (internal health — block from public) ──────────────
    location /actuator {
        deny all;
        return 403;
    }
}