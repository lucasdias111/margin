# ── Rate limit zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=downloads:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=beta_signup:10m rate=5r/h;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_status 429;

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name margin.chat;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name margin.chat;

    ssl_certificate     /etc/letsencrypt/live/margin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/margin.chat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Beta signup (landing page route — must be before /api/ and /) ──────
    location /api/beta-signup {
        limit_req zone=beta_signup burst=3 nodelay;
        proxy_pass         http://margin-landing:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Spring Boot REST API ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass         http://margin-server:8080/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Spring Boot auth endpoints (tighter limit) ─────────────────────────
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass         http://margin-server:8080/api/auth/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Spring Boot WebSocket (Netty) ──────────────────────────────────────
    location /ws {
        proxy_pass          http://margin-server:8081/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── mediasoup SFU signaling WebSocket ─────────────────────────────────
    location /sfu {
        proxy_pass          http://margin-sfu:3000/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Spring Actuator (internal health — block from public) ──────────────
    location /actuator {
        deny all;
        return 403;
    }

    # ── Landing page (catch-all) ───────────────────────────────────────────
    location / {
        proxy_pass         http://margin-landing:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Download endpoints ─────────────────────────────────────────────────
    location /download/linux-latest {
        limit_req zone=downloads burst=5;
        proxy_pass https://nbg1.your-objectstorage.com/margininstall/margin-latest.AppImage;
        proxy_set_header Host nbg1.your-objectstorage.com;
        proxy_ssl_server_name on;

        add_header Content-Disposition 'attachment; filename="Margin.AppImage"';
    }

    location /download/windows-latest {
        limit_req zone=downloads burst=5;
        proxy_pass https://nbg1.your-objectstorage.com/margininstall/margin-latest-setup.exe;
        proxy_set_header Host nbg1.your-objectstorage.com;
        proxy_ssl_server_name on;

        add_header Content-Disposition 'attachment; filename="Margin-setup.exe"';
    }

    location /download/mac-latest {
        limit_req zone=downloads burst=5;
        proxy_pass https://nbg1.your-objectstorage.com/margininstall/margin-latest.dmg;
        proxy_set_header Host nbg1.your-objectstorage.com;
        proxy_ssl_server_name on;

        add_header Content-Disposition 'attachment; filename="Margin.dmg"';
    }
}