# coturn/turnserver.conf

# ── Network ───────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=135.181.100.126   # Replace with your Hetzner public IP / use $HETZNER_PUBLIC_IP

# ── Relay ports (open these in Hetzner firewall) ──────────────────────────
min-port=49152
max-port=65535

# ── Auth ──────────────────────────────────────────────────────────────────
lt-cred-mech
user=margin:changeme_coturn_password   # Match what your WebRTC client sends
realm=margin.chat

# ── TLS ───────────────────────────────────────────────────────────────────
cert=/etc/letsencrypt/live/margin.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/margin.yourdomain.com/privkey.pem

# ── Security ──────────────────────────────────────────────────────────────
no-loopback-peers
no-multicast-peers
# Uncomment to restrict relay to your SFU IP only (recommended):
# allowed-peer-ip=<mediasoup-host-ip>

# ── Logging ───────────────────────────────────────────────────────────────
log-file=stdout
verbose