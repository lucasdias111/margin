# Provisioned at container start. Both datasources log in as read-only roles
# created by ../../sql/*.sql -- Grafana must never hold a read-write DB user,
# because anyone with an editor login can run arbitrary SQL from a panel.
apiVersion: 1

datasources:
  - name: MarginDB
    uid: margindb
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    database: $MARGIN_DB_NAME
    user: $GRAFANA_DB_USER
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 4
      connMaxLifetime: 14400
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD

  - name: Umami
    uid: umami
    type: grafana-postgresql-datasource
    access: proxy
    url: umami-db:5432
    database: umami
    user: $GRAFANA_DB_USER
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 4
      connMaxLifetime: 14400
    secureJsonData:
      password: $GRAFANA_UMAMI_DB_PASSWORD
