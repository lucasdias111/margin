apiVersion: 1

providers:
  - name: margin
    orgId: 1
    folder: Margin
    type: file
    disableDeletion: false
    # Edits made in the UI survive a restart; a dashboard file only wins again
    # once its "version" field is bumped above the version stored in the DB.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
