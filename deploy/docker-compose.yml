services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    container_name: margindb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - margin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  margin-server:
    image: codeberg.org/margin/margin-server:${SERVER_VERSION:-latest}
    pull_policy: never
    container_name: margin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      WEBSOCKET_PORT: 8081
      SFU_URL: http://margin-sfu:3000
      SFU_PUBLIC_URL: ${SFU_PUBLIC_URL}
      SFU_SECRET: ${SFU_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      HETZNER_S3_ENDPOINT: ${HETZNER_S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      APP_BASE_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY}
      MOLLIE_WEBHOOK_BASE_URL: ${MOLLIE_WEBHOOK_BASE_URL}
      MOLLIE_REDIRECT_BASE_URL: ${MOLLIE_REDIRECT_BASE_URL}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    networks:
      - margin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  margin-sfu:
    image: codeberg.org/margin/margin-sfu:${SFU_VERSION:-latest}
    pull_policy: never
    container_name: margin-sfu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SFU_SECRET: ${SFU_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_URL: http://margin-server:8080
      ANNOUNCED_IP: ${PUBLIC_IP}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
    ports:
      - "40000-40100:40000-40100/udp"
    networks:
      - margin-net
    depends_on:
      - margin-server

  coturn:
    image: coturn/coturn:latest
    container_name: margin-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  nginx:
    image: nginx:alpine
    container_name: margin-nginx
    restart: unless-stopped
    depends_on:
      - margin-server
      - margin-sfu
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - margin-net

  certbot:
    image: certbot/certbot:latest
    container_name: margin-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
             --email ${ADMIN_EMAIL}
             --agree-tos --no-eff-email
             -d ${DOMAIN}"
    profiles:
      - certbot

  margin-landing:
    build: /opt/margin-landing
    restart: unless-stopped
    environment:
      - MARGIN_API_URL=http://margin-server:8080
    networks:
      - margin-net

  margin-web:
    build:
      context: /opt/margin-desktop
      dockerfile: Dockerfile.web
    container_name: margin-web
    restart: unless-stopped
    networks:
      - margin-net

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - margin-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U umami" ]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    networks:
      - margin-net
    depends_on:
      umami-db:
        condition: service_healthy

networks:
  margin-net:
    driver: bridge

volumes:
  postgres_data:
  certbot_webroot:
  umami_db_data:
