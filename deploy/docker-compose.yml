services:

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: margin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - margin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Spring Boot Backend
  # ─────────────────────────────────────────
  margin-server:
    image: margin/server:${APP_VERSION:-latest}
    # Build: mvn spring-boot:build-image
    # Image name is set in pom.xml: <name>margin/server:${project.version}</name>
    # Deploy a specific version: APP_VERSION=1.0.0 docker compose up -d
    # Rollback: APP_VERSION=0.9.0 docker compose up -d margin-server
    container_name: margin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      # Internal SFU webhook — margin-server calls mediasoup-sfu directly
      SFU_WEBHOOK_URL: http://mediasoup-sfu:3000
      SERVER_PORT: 8080
    networks:
      - margin-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # mediasoup SFU (Node.js)
  # ─────────────────────────────────────────
  mediasoup-sfu:
    build:
      context: ./mediasoup-sfu        # path to your SFU repo/folder
      dockerfile: Dockerfile
    image: margin/mediasoup-sfu:${APP_VERSION:-latest}
    container_name: margin-mediasoup
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # mediasoup needs to know the public IP for RTP announcements
      MEDIASOUP_ANNOUNCED_IP: ${HETZNER_PUBLIC_IP}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      # Port ranges must match the expose block below
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      # Spring backend server-to-server webhook secret
      MARGIN_SERVER_WEBHOOK_SECRET: ${SFU_WEBHOOK_SECRET}
    ports:
      # RTP/RTCP UDP range for mediasoup workers
      - "40000-40100:40000-40100/udp"
      # Signaling WebSocket — proxied by Nginx, not exposed directly
      # exposed only on the internal network below
    networks:
      - margin-net
    depends_on:
      - margin-server

  # ─────────────────────────────────────────
  # Coturn TURN/STUN server
  # ─────────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: margin-coturn
    restart: unless-stopped
    # Must use host networking — TURN relay UDP port range cannot be NAT'd
    # reliably through Docker bridge networking.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  # ─────────────────────────────────────────
  # Nginx — TLS termination + reverse proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: margin-nginx
    restart: unless-stopped
    depends_on:
      - margin-server
      - mediasoup-sfu
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot for renewals
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - margin-net

  # ─────────────────────────────────────────
  # Certbot — Let's Encrypt cert renewal
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: margin-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Runs once and exits — invoke manually or via cron:
    # docker compose run --rm certbot renew
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
             --email ${ADMIN_EMAIL}
             --agree-tos --no-eff-email
             -d ${DOMAIN}"
    profiles:
      - certbot   # Only runs when explicitly invoked: docker compose --profile certbot up certbot

# ─────────────────────────────────────────
# Networks & Volumes
# ─────────────────────────────────────────
networks:
  margin-net:
    driver: bridge

volumes:
  postgres_data:
  certbot_webroot: