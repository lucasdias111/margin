x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    container_name: margindb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - margin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
  margin-server:
    image: ghcr.io/marginchat/margin-server:${SERVER_VERSION:-latest}
    pull_policy: never
    container_name: margin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      WEBSOCKET_PORT: 8081
      SFU_URL: http://margin-sfu:3000
      SFU_PUBLIC_URL: ${SFU_PUBLIC_URL}
      SFU_SECRET: ${SFU_SECRET}
      MEETING_GUEST_TOKEN_SECRET: ${MEETING_GUEST_TOKEN_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      APP_BASE_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    volumes:
      - ./secrets:/run/secrets:ro
    networks:
      - margin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  margin-sfu:
    image: ghcr.io/marginchat/margin-sfu:${SFU_VERSION:-latest}
    pull_policy: never
    container_name: margin-sfu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SFU_SECRET: ${SFU_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_URL: http://margin-server:8080
      ANNOUNCED_IP: ${PUBLIC_IP}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      SFU_ALLOWED_ORIGINS: ${SFU_ALLOWED_ORIGINS:-}
      SFU_ROOM_IDLE_MS: ${SFU_ROOM_IDLE_MS:-300000}
    ports:
      - "40000-40100:40000-40100/udp"
    networks:
      - margin-net
    depends_on:
      - margin-server
    logging: *default-logging

  coturn:
    image: coturn/coturn:latest
    container_name: margin-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: margin-nginx
    restart: unless-stopped
    depends_on:
      - margin-server
      - margin-sfu
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - margin-net
    logging: *default-logging

  margin-web:
    build:
      context: ../client
      dockerfile: Dockerfile.web
    container_name: margin-web
    restart: unless-stopped
    networks:
      - margin-net
    logging: *default-logging

networks:
  margin-net:
    driver: bridge

volumes:
  postgres_data: