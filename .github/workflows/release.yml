# Publishes an instance release on a vX.Y.Z tag: the server, sfu and web
# images for amd64 and arm64, and a GitHub Release carrying the deploy bundle,
# with the tag's CHANGELOG.md section as its notes.
#
# Each architecture builds on its own native runner (so the SFU installs the
# mediasoup worker built for that arch, with no emulation), pushes by digest,
# and a merge job then tags the multi-arch manifest. Nothing gets a tag until
# the tests and the backup smoke test pass.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lucasdias111/margin

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Read the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $TAG isn't vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
      # Fail before building anything when the notes are missing.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! .github/scripts/changelog-section.sh "$VERSION" CHANGELOG.md >notes.md; then
            echo "::error file=CHANGELOG.md::no '## [$VERSION]' section in CHANGELOG.md; add one and re-tag"
            exit 1
          fi
          # Relative links (docs/…) don't resolve on the release page; point them at the tag.
          sed -i -E "s#\]\(([^):#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

  tests:
    name: Tests
    needs: prepare
    uses: ./.github/workflows/pr.yml

  smoke:
    name: Backup smoke test
    needs: prepare
    uses: ./.github/workflows/backup-smoke.yml

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, sfu, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: server
            context: server
            file: server/Dockerfile
          - image: sfu
            context: sfu
            file: sfu/Dockerfile
          - image: web
            context: client
            file: client/Dockerfile.web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=margin-${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Tag margin-${{ matrix.image }}
    needs: [prepare, tests, smoke, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, sfu, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # x.y.z, x.y, x and latest; a prerelease (vX.Y.Z-rc.1) only gets its own tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set --
          for tag in $TAGS; do set -- "$@" -t "$tag"; done
          for digest in *; do set -- "$@" "$IMAGE@sha256:$digest"; done
          docker buildx imagetools create "$@"
      - name: Inspect
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          for arch in amd64 arm64; do
            docker buildx imagetools inspect --raw "$IMAGE:$VERSION" \
              | jq -e --arg a "$arch" 'any(.manifests[]; .platform.architecture == $a)' >/dev/null \
              || { echo "::error::$IMAGE:$VERSION has no $arch image"; exit 1; }
          done

  release:
    name: GitHub Release
    needs: [prepare, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Stage the deploy bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/release-assets.sh "$VERSION" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # install.sh is fetched from releases/latest, so a prerelease must never become latest.
          if [ "$PRERELEASE" = true ]; then
            set -- --prerelease --latest=false
          else
            set -- --latest
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: refresh the notes and assets of the existing release.
            gh release edit "$TAG" --title "margin $VERSION" --notes-file notes.md "$@"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "margin $VERSION" --notes-file notes.md "$@"
          fi
